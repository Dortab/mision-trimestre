<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guía de Mundos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Lilita+One&family=Noto+Sans+Egyptian+Hieroglyphs&display=swap">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="barra wrap">
  <a class="volver" href="index.html">Inicio</a>
  <div class="barra-xp">
    <span class="xp-num"><span id="xp">0</span> <small>de <span id="xp-total">0</span> XP</small></span>
    <div class="meter"><i id="bar"></i></div>
    <span id="xp-next" class="intro"></span>
  </div>
  <div class="pomo">
    <output id="pomo-t">25:00</output>
    <button class="btn small" id="pomo-go">Iniciar pomodoro</button>
    <button class="btn small" id="pomo-re">Reiniciar</button>
  </div>
</header>

<nav class="board wrap" id="board" aria-label="Mundos"></nav>
<main class="wrap" id="world"></main>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/datos.js"></script>
<script src="js/temas.js"></script>
<script src="js/comun.js"></script>
<script src="js/juegos.js"></script>
<script src="js/guia.js"></script>
</body>
</html>
